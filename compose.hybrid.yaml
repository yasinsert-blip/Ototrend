name: ototrend

# Oracle'da web uygulaması ve zamanlayıcı çalışır. AI modeli ise Tailscale ile
# erişilen kişisel bilgisayardaki Ollama'da kalır; bu sayede Always Free makine
# RAM'i model çalıştırmak için kullanılmaz.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      RUN_SCHEDULER: "false"
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/news.db}
      OLLAMA_HOST: ${OLLAMA_HOST:?OLLAMA_HOST must point to the private Ollama address}
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build: .
    command: ["python", "-m", "app.scheduler.runner"]
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      RUN_SCHEDULER: "false"
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/news.db}
      OLLAMA_HOST: ${OLLAMA_HOST:?OLLAMA_HOST must point to the private Ollama address}
    volumes:
      - app_data:/data
    depends_on:
      app:
        condition: service_healthy

  backup:
    build: .
    command: ["sh", "-c", "while true; do python scripts/backup_sqlite.py; sleep 86400; done"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/news.db}
      BACKUP_DIR: /backups
    volumes:
      - app_data:/data:ro
      - backup_data:/backups
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_data:
  backup_data:
  caddy_data:
  caddy_config:
