<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>

        {% block title %}
            OtoTrend AI CMS
        {% endblock %}

    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/theme.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/sidebar.css') }}?v=logo-compact-3"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/dashboard.css') }}"
    >

    {% block styles %}{% endblock %}

</head>

<body>

<div class="wrapper">

    {% include "partials/sidebar.html" %}

    <div class="main-content">

        {% include "partials/navbar.html" %}

        <main class="container-fluid py-4">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Global UI Library -->

<script src="{{ url_for('static', path='js/ui.js') }}"></script>

<!-- App -->

<script src="{{ url_for('static', path='js/app.js') }}"></script>

{% block scripts %}
{% endblock %}

<!-- ===================================================== -->
<!-- Loading Overlay -->
<!-- ===================================================== -->

<div
    id="loadingOverlay"
    class="d-none position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-flex justify-content-center align-items-center"
    style="z-index:2000;"
>

    <div
        class="spinner-border text-light"
        role="status"
    >
        <span class="visually-hidden">
            Loading...
        </span>
    </div>

</div>

<!-- ===================================================== -->
<!-- Toast Container -->
<!-- ===================================================== -->

<div
    id="toastContainer"
    class="toast-container position-fixed top-0 end-0 p-3"
    style="z-index:2055;"
>

</div>

<!-- ===================================================== -->
<!-- Confirm Modal -->
<!-- ===================================================== -->

<div
    class="modal fade"
    id="confirmModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Onay
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div class="modal-body">

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    İptal
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="confirmOk"
                >
                    Devam Et
                </button>

            </div>

        </div>

    </div>

</div>

</body>

</html>
